name: Client onboarding QA

on:
  push:
    branches: [fix/onboarding-qa-20261030, main]
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/qa-onboarding.yml"
  workflow_dispatch:

jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLASK_ENV: testing
      SECRET_KEY: "gha-only-test-secret-not-for-production"
      DATABASE_URL: sqlite:////tmp/vetassistance-onboarding-ci.db
      STORAGE_ROOT: /tmp/vetassistance-onboarding-ci-uploads
      UPLOAD_FOLDER: /tmp/vetassistance-onboarding-ci-uploads
      RATELIMIT_STORAGE_URL: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Exercise onboarding with fake email and disposable SQLite
        run: python -m pytest -q tests/test_client_onboarding.py tests/test_email.py
