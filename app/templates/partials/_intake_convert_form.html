<form method="post" action="{{ url_for('intakes.convert_submit', intake_id=row.id) }}" class="stack-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label" for="ovName">Veteran's name</label>
  <input id="ovName" class="form-control" name="override_full_name" value="{{ meta.full_name if meta else '' }}" placeholder="First and last name">
  <label class="form-label" for="ovPhone">Phone</label>
  <input id="ovPhone" class="form-control" name="override_phone" value="{{ meta.phone if meta else '' }}" inputmode="tel">
  <label class="form-label" for="ovRep">Assign to</label>
  <select id="ovRep" class="form-control" name="assigned_user_id">
    <option value="">Unassigned</option>
    {% for u in reps %}<option value="{{ u.id }}"{% if u.id == current_user.id %} selected{% endif %}>{{ u.full_name or u.email }}</option>{% endfor %}
  </select>
  <label class="check"><input type="checkbox" name="make_portal" value="1" checked> Open a client portal and email the veteran an invite</label>
  <button class="btn btn-primary" type="submit">Create client file</button>
  <p class="muted small" style="margin:0;">Fills in the client's details and moves the uploaded file into their Documents.</p>
</form>
