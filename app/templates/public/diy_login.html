{% extends "base.html" %}
{% block title %}DIY Login{% endblock %}
{% block content %}
<div class="auth">
  {% include "partials/_auth_aside.html" %}
  <section class="auth-card auth-legacy" aria-labelledby="ah">
    <h1 id="ah">Sign in to the DIY toolkit</h1>
    <p class="auth-sub">Access your DIY tools and subscription.</p>


<div class="admin-wrap">
  <div class="card-shell">
    <div class="card-body-pad">
      <form method="post" action="{{ url_for('diy.login_post') }}" >
        <label>Email</label>
        <input name="email" type="email" required>
        <label>Password</label>
        <input name="password" type="password" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>

  </section>
</div>
{% endblock %}
