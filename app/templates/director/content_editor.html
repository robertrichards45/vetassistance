
{% extends "base.html" %}
{% block content %}
<div class="card vca-card">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Site Content Editor</h1>
    <p class="text-muted">Edit site text without touching code. Content is stored in the <code>site_content</code> table.</p>
    <form method="post" class="vca-form">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Slug</label>
          <input class="form-control" name="slug" value="{{ content.slug }}" required>
          <div class="form-text">Use <code>home</code> for the homepage.</div>
        </div>
        <div class="col-md-8">
          <label class="form-label">Title</label>
          <input class="form-control" name="title" value="{{ content.title }}" required>
        </div>
        <div class="col-12">
          <label class="form-label">Body</label>
          <textarea class="form-control" rows="10" name="body" required>{{ content.body }}</textarea>
          <div class="form-text">Separate paragraphs with a blank line.</div>
        </div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('home') }}">View Homepage</a>
        <a class="btn btn-outline-dark" href="{{ url_for('director_dashboard') }}">Back</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
