services:
  web:
    build: ..
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../instance:/app/instance
      - ../uploads:/app/uploads
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped
